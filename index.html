<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中郷FC Compass</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#16a34a;--warn:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{background:linear-gradient(135deg,#1d4ed8,#38bdf8);color:white;padding:18px 16px 22px}
h1{font-size:24px;margin:0 0 6px}header p{margin:0;font-size:14px;opacity:.95}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
h2{font-size:20px;margin:0 0 12px}.pill{display:inline-block;background:#eef2ff;color:#1d4ed8;padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:8px}
label{font-weight:700;font-size:14px;display:block;margin:12px 0 5px}
input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
button{border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:800;background:var(--accent);color:white;width:100%;margin-top:10px}
button.sub{background:#111827}button.copy{background:var(--good)}button.danger{background:var(--warn)}
.result{background:#f8fafc;border:1px dashed #94a3b8;border-radius:14px;padding:14px;margin-top:12px;white-space:pre-wrap;line-height:1.7}
.small{font-size:13px;color:var(--muted);line-height:1.6}.total{font-size:28px;font-weight:900;color:#1d4ed8}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:14px}th{color:#475569}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{margin:0;padding:10px;background:#e5e7eb;color:#111827}.tabs button.on{background:#2563eb;color:white}
.hide{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:22px}.wrap{padding:10px}.card{padding:14px}}
@media print{header,.tabs,button,.no-print{display:none}.card{box-shadow:none;border:1px solid #ddd}.wrap{max-width:none}}
</style>
</head>
<body>
<header>
<h1>中郷FC Compass</h1>
<p>応援車・配車交通費のスマホ計算版</p>
</header>

<div class="wrap">
  <div class="tabs no-print">
    <button class="on" onclick="showTab('calc',this)">計算</button>
    <button onclick="showTab('dest',this)">遠征先</button>
    <button onclick="showTab('rule',this)">ルール</button>
  </div>

  <section id="calc">
    <div class="card">
      <span class="pill">スマホ入力</span>
      <h2>交通費を計算</h2>
      <div class="grid">
        <div class="full">
          <label>遠征先</label>
          <select id="place"></select>
        </div>
        <div>
          <label>応援車 台数</label>
          <input id="cars" type="number" min="0" value="1">
        </div>
        <div>
          <label>区分</label>
          <select id="road">
            <option value="auto">自動判定</option>
            <option value="local">下道</option>
            <option value="highway">高速</option>
          </select>
        </div>
        <div>
          <label>下道 1台あたり</label>
          <input id="localFee" type="number" value="1500">
        </div>
        <div>
          <label>高速 1台あたり</label>
          <input id="highwayFee" type="number" value="2000">
        </div>
        <div>
          <label>選手バス代</label>
          <select id="bus">
            <option value="0">計算しない</option>
            <option value="2500">日帰り 2,500円</option>
            <option value="3000">宿泊 3,000円</option>
          </select>
        </div>
        <div>
          <label>選手人数</label>
          <input id="players" type="number" min="0" value="0">
        </div>
      </div>
      <button onclick="calc()">計算する</button>
      <div id="out" class="result">ここに計算結果が出ます。</div>
      <button class="copy" onclick="copyLine()">LINE用文章をコピー</button>
      <p class="small">※この計算表は中郷FC育成会内の確認用です。正式な金額は会計・役員確認を優先してください。</p>
    </div>
  </section>

  <section id="dest" class="hide">
    <div class="card">
      <span class="pill">ちはる専用メモ</span>
      <h2>遠征先を追加・編集</h2>
      <div class="grid">
        <div>
          <label>遠征先名</label>
          <input id="newName" placeholder="例：丸岡スポーツランド">
        </div>
        <div>
          <label>片道距離 km</label>
          <input id="newKm" type="number" placeholder="例：72">
        </div>
        <div class="full">
          <label>高速区分</label>
          <select id="newType">
            <option value="auto">片道60km超は高速</option>
            <option value="local">必ず下道</option>
            <option value="highway">必ず高速</option>
          </select>
        </div>
        <div class="full">
          <label>メモ</label>
          <input id="newMemo" placeholder="例：敦賀IC〜鯖江IC、その後下道">
        </div>
      </div>
      <button onclick="addDest()">遠征先を追加</button>
      <button class="danger" onclick="resetDest()">初期状態に戻す</button>
      <div id="list"></div>
    </div>
  </section>

  <section id="rule" class="hide">
    <div class="card">
      <h2>反映しているルール</h2>
      <div class="result">・配車交通費：下道 1,500円／高速 2,000円
・高速基準：片道60km超で高速扱い
・大飯：往復下道
・丸岡・三国：敦賀IC〜鯖江ICを高速、その後下道
・選手マイクロバス代：日帰り 2,500円／宿泊 3,000円
・必要に応じて遠征先は追加・編集可能</div>
    </div>
  </section>
</div>

<script>
const defaults=[
 {name:"大飯",km:55,type:"local",memo:"往復下道"},
 {name:"丸岡",km:82,type:"highway",memo:"敦賀IC〜鯖江IC、その後下道"},
 {name:"三国",km:95,type:"highway",memo:"敦賀IC〜鯖江IC、その後下道"},
 {name:"その他（60km以下）",km:30,type:"local",memo:"下道想定"},
 {name:"その他（60km超）",km:70,type:"auto",memo:"60km超のため高速想定"}
];
let dest=JSON.parse(localStorage.getItem("nakago_dest")||"null")||defaults;
let lastText="";

function yen(n){return Number(n||0).toLocaleString()+"円"}
function save(){localStorage.setItem("nakago_dest",JSON.stringify(dest))}
function loadPlaces(){
 const s=document.getElementById("place"); s.innerHTML="";
 dest.forEach((d,i)=>{let o=document.createElement("option");o.value=i;o.textContent=d.name;s.appendChild(o)});
 renderList();
}
function roadOf(d){
 const manual=document.getElementById("road").value;
 if(manual!=="auto")return manual;
 if(d.type==="local")return "local";
 if(d.type==="highway")return "highway";
 return Number(d.km)>60?"highway":"local";
}
function calc(){
 const d=dest[Number(document.getElementById("place").value||0)];
 const cars=Number(document.getElementById("cars").value||0);
 const localFee=Number(document.getElementById("localFee").value||1500);
 const highwayFee=Number(document.getElementById("highwayFee").value||2000);
 const road=roadOf(d);
 const per=road==="highway"?highwayFee:localFee;
 const carTotal=cars*per;
 const busFee=Number(document.getElementById("bus").value||0);
 const players=Number(document.getElementById("players").value||0);
 const busTotal=busFee*players;
 const total=carTotal+busTotal;
 const roadLabel=road==="highway"?"高速":"下道";
 lastText=`【中郷FC Compass 計算結果】
遠征先：${d.name}
区分：${roadLabel}
応援車：${cars}台 × ${yen(per)} = ${yen(carTotal)}
${busFee?`選手バス代：${players}名 × ${yen(busFee)} = ${yen(busTotal)}\n`:""}合計：${yen(total)}
メモ：${d.memo||"なし"}`;
 document.getElementById("out").innerHTML=lastText.replace(`合計：${yen(total)}`,`合計：<span class="total">${yen(total)}</span>`);
}
async function copyLine(){
 if(!lastText)calc();
 try{await navigator.clipboard.writeText(lastText);alert("LINE用文章をコピーしました")}
 catch(e){alert("コピーできない場合は、計算結果を長押ししてコピーしてください")}
}
function addDest(){
 const name=document.getElementById("newName").value.trim();
 if(!name){alert("遠征先名を入れてね");return}
 dest.push({name,km:Number(document.getElementById("newKm").value||0),type:document.getElementById("newType").value,memo:document.getElementById("newMemo").value.trim()});
 save();loadPlaces();
 document.getElementById("newName").value="";document.getElementById("newKm").value="";document.getElementById("newMemo").value="";
}
function delDest(i){if(confirm("削除する？")){dest.splice(i,1);save();loadPlaces()}}
function resetDest(){if(confirm("初期状態に戻す？追加した遠征先は消えます")){dest=[...defaults];save();loadPlaces()}}
function renderList(){
 const el=document.getElementById("list"); if(!el)return;
 el.innerHTML="<table><tr><th>遠征先</th><th>km</th><th>区分</th><th></th></tr>"+dest.map((d,i)=>`<tr><td>${d.name}<br><span class="small">${d.memo||""}</span></td><td>${d.km}</td><td>${d.type}</td><td><button class="danger" onclick="delDest(${i})">削除</button></td></tr>`).join("")+"</table>";
}
function showTab(id,btn){
 document.querySelectorAll("section").forEach(s=>s.classList.add("hide"));
 document.getElementById(id).classList.remove("hide");
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));
 btn.classList.add("on");
}
loadPlaces();calc();
</script>
</body>
</html>
